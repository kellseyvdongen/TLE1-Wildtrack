<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="main.css?v=2">
    <script defer src="./js/search.js" type="text/javascript"></script>

    <title>Document</title>
</head>
<body>
<div id="navigation">
    <nav>
        <div>
            <div>
                <img src="images/logo.png" alt="Logo">
            </div>
            <div>
                <img src="images/overview.png" alt="Overview Icon">
                <img src="images/animals-icon.png" alt="Animal Icon">
                <img src="images/statistics.png" alt="Statistics Icon">
            </div>
        </div>
        <div>
            <img src="images/help.png" alt="Help Icon">
        </div>
    </nav>
</div>
<div id="sidebar">
    <div class="sidebar-header">
    <h1>WildTrack</h1>
        <p>Nature monitoring</p>
    </div>
    <div id="animal-list">
        <div>
            <form id="search-form">
                <input type="text" id="animals" placeholder="name of animal">
                <button type="submit">Search</button>
            </form>
        </div>
        <div id="animals-list">
        </div>
    </div>
</div>


<div id="map">
    <div id="map-container">
        <img class="map-picture" src="images/map.png" alt="Map of the world">
    </div>

</div>
<div id="animal-details">
    <div class="details-top">
        <img alt="" id="details-image" src="">
        <div class="details-info">
            <h1 id="details-name"></h1>

            <p><strong>Gender</strong></p>
            <p id="details-gender"></p>

            <p><strong>Estimated date of birth</strong></p>
            <p id="details-birth"></p>

            <p><strong>First observation</strong></p>
            <p id="details-first-observation"></p>

            <p><strong>Status</strong></p>
            <p id="details-status"></p>

            <p><strong>Remark</strong></p>
            <p id="details-remark"></p>
        </div>
    </div>


    <div id="physical-features">
        <h2>Physical features</h2>

        <div class="feature">
            <p class="feature-label">Weight</p>
            <p id="details-weight"></p>
        </div>

        <div class="feature">
            <p class="feature-label">Height at the withers</p>
            <p id="details-height"></p>
        </div>

        <div class="feature">
            <p class="feature-label">Coat color</p>
            <p id="details-coat"></p>
        </div>

        <div class="feature">
            <p class="feature-label">Eye color</p>
            <p id="details-eye"></p>
        </div>
    </div>

</div>


</body>
</html>
